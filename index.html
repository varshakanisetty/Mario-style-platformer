<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sunrunner – Platformer</title>
  <style>
    /* ─── Root theme ─────────────────────────────────────────── */
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    :root {
      --sky: #1a1a2e;
      --ground: #16213e;
      --accent: #e94560;
      --gold: #f5a623;
      --teal: #0f3460;
      --text: #eaeaea;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--sky);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Press Start 2P', monospace;
      color: var(--text);
      overflow: hidden;
    }

    /* ─── HUD (score / lives) ─────────────────────────────────── */
    #hud {
      display: flex;
      justify-content: space-between;
      width: 800px;
      max-width: 95vw;
      padding: 10px 4px;
      font-size: 10px;
      letter-spacing: 1px;
    }
    #hud span { color: var(--gold); }

    /* ─── Canvas wrapper ──────────────────────────────────────── */
    #canvas-wrap {
      position: relative;
      border: 3px solid var(--accent);
      box-shadow: 0 0 40px #e9456066, 0 0 80px #e9456022;
    }

    canvas { display: block; }

    /* ─── Overlay screens ─────────────────────────────────────── */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10, 10, 26, 0.88);
      backdrop-filter: blur(4px);
      gap: 20px;
      text-align: center;
      padding: 20px;
    }
    .overlay h1 { font-size: 22px; color: var(--accent); line-height: 1.6; }
    .overlay p  { font-size: 9px;  color: #aaa; line-height: 2; }
    .overlay .score-final { font-size: 13px; color: var(--gold); }
    .overlay button {
      margin-top: 10px;
      padding: 12px 28px;
      background: var(--accent);
      color: #fff;
      border: none;
      font-family: inherit;
      font-size: 10px;
      cursor: pointer;
      letter-spacing: 2px;
      transition: transform .1s, box-shadow .1s;
      box-shadow: 0 4px 0 #8b1c2e;
    }
    .overlay button:hover  { transform: translateY(-2px); box-shadow: 0 6px 0 #8b1c2e; }
    .overlay button:active { transform: translateY(2px);  box-shadow: 0 2px 0 #8b1c2e; }

    #controls {
      margin-top: 8px;
      font-size: 8px;
      color: #666;
      text-align: center;
      width: 800px;
      max-width: 95vw;
    }
  </style>
</head>
<body>

<div id="hud">
  <div>SCORE&nbsp;<span id="scoreDisplay">0</span></div>
  <div>COINS&nbsp;<span id="coinDisplay">0</span></div>
  <div>LIVES&nbsp;<span id="livesDisplay">3</span></div>
</div>

<div id="canvas-wrap">
  <canvas id="gameCanvas" width="800" height="450"></canvas>

  <!-- START SCREEN -->
  <div class="overlay" id="startScreen">
    <h1>☀ SUNRUNNER</h1>
    <p>Collect coins · Stomp enemies · Survive!</p>
    <p>← → to move &nbsp;|&nbsp; Z / ↑ / SPACE to jump</p>
    <button id="startBtn">PLAY</button>
  </div>

  <!-- GAME OVER SCREEN -->
  <div class="overlay" id="gameOverScreen" style="display:none">
    <h1>GAME OVER</h1>
    <div class="score-final" id="finalScore">SCORE: 0</div>
    <button id="restartBtn">RETRY</button>
  </div>

  <!-- WIN SCREEN (reached end flag) -->
  <div class="overlay" id="winScreen" style="display:none">
    <h1>YOU WIN! 🏆</h1>
    <div class="score-final" id="winScore">SCORE: 0</div>
    <button id="winRestartBtn">PLAY AGAIN</button>
  </div>
</div>

<div id="controls">Arrow keys / WASD · Z / SPACE / ↑ = Jump · Double-jump enabled!</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  SUNRUNNER – 2D Platformer
//  Single-file Canvas game
// ═══════════════════════════════════════════════════════════════

const canvas  = document.getElementById('gameCanvas');
const ctx     = canvas.getContext('2d');
const W = canvas.width;   // 800
const H = canvas.height;  // 450

// ── DOM references ────────────────────────────────────────────
const startScreen   = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const winScreen     = document.getElementById('winScreen');
const scoreDisplay  = document.getElementById('scoreDisplay');
const coinDisplay   = document.getElementById('coinDisplay');
const livesDisplay  = document.getElementById('livesDisplay');

// ══════════════════════════════════════════════════════════════
//  CONSTANTS & CONFIG
// ══════════════════════════════════════════════════════════════
const GRAVITY   = 0.55;   // downward acceleration per frame
const JUMP_VEL  = -13;    // initial upward velocity on jump
const MOVE_SPD  = 4;      // horizontal player speed
const CAM_SLACK = W * 0.4; // how far player walks before camera scrolls

// ══════════════════════════════════════════════════════════════
//  GAME STATE
// ══════════════════════════════════════════════════════════════
let state; // 'start' | 'playing' | 'dead' | 'win'

// Keyboard input map
const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true;  handleJump(e); });
window.addEventListener('keyup',   e => { keys[e.code] = false; });

// ──────────────────────────────────────────────────────────────
//  WORLD DEFINITION (platforms, enemies, coins, flag)
// ──────────────────────────────────────────────────────────────
// Everything is in world-space (pixels from left edge of level).
// Camera offset is subtracted when drawing.

function buildLevel() {
  // Ground segments: { x, y, w, h }
  const platforms = [
    // long ground floor
    { x: 0,    y: 380, w: 4200, h: 70, color: '#2d6a4f' },

    // floating platforms (color: mossy green / stone)
    { x: 260,  y: 300, w: 120,  h: 18, color: '#3d8b6e' },
    { x: 420,  y: 250, w: 100,  h: 18, color: '#3d8b6e' },
    { x: 560,  y: 200, w: 140,  h: 18, color: '#5a6e8a' },
    { x: 740,  y: 300, w: 100,  h: 18, color: '#3d8b6e' },
    { x: 880,  y: 240, w: 120,  h: 18, color: '#3d8b6e' },
    { x: 1040, y: 300, w: 140,  h: 18, color: '#5a6e8a' },
    { x: 1220, y: 220, w: 100,  h: 18, color: '#3d8b6e' },
    { x: 1380, y: 290, w: 160,  h: 18, color: '#5a6e8a' },
    { x: 1580, y: 220, w: 120,  h: 18, color: '#3d8b6e' },
    { x: 1740, y: 300, w: 100,  h: 18, color: '#3d8b6e' },
    { x: 1900, y: 240, w: 140,  h: 18, color: '#5a6e8a' },
    { x: 2080, y: 190, w: 100,  h: 18, color: '#3d8b6e' },
    { x: 2240, y: 260, w: 120,  h: 18, color: '#3d8b6e' },
    { x: 2420, y: 200, w: 100,  h: 18, color: '#5a6e8a' },
    { x: 2580, y: 310, w: 120,  h: 18, color: '#3d8b6e' },
    { x: 2760, y: 230, w: 140,  h: 18, color: '#3d8b6e' },
    { x: 2940, y: 280, w: 100,  h: 18, color: '#5a6e8a' },
    { x: 3100, y: 210, w: 120,  h: 18, color: '#3d8b6e' },
    { x: 3300, y: 300, w: 100,  h: 18, color: '#3d8b6e' },
    { x: 3460, y: 220, w: 140,  h: 18, color: '#5a6e8a' },
    { x: 3650, y: 280, w: 120,  h: 18, color: '#3d8b6e' },
    { x: 3850, y: 200, w: 100,  h: 18, color: '#3d8b6e' },
  ];

  // Coins: { x, y, collected }
  const coins = [];
  const coinPositions = [
    [290,270],[320,270],[350,270],
    [440,220],[470,220],[500,220],
    [580,170],[610,170],[640,170],
    [760,270],[790,270],
    [900,210],[930,210],[960,210],
    [1060,270],[1090,270],[1120,270],
    [1240,190],[1270,190],
    [1400,260],[1430,260],[1460,260],
    [1600,190],[1630,190],
    [1760,270],[1790,270],
    [1920,210],[1950,210],[1980,210],
    [2100,160],[2130,160],
    [2260,230],[2290,230],[2320,230],
    [2440,170],[2470,170],
    [2600,280],[2630,280],[2660,280],
    [2780,200],[2810,200],[2840,200],
    [2960,250],[2990,250],
    [3120,180],[3150,180],[3180,180],
    [3320,270],[3350,270],
    [3480,190],[3510,190],[3540,190],
    [3670,250],[3700,250],
    [3870,170],[3900,170],[3930,170],
    // ground-level clusters
    [150,350],[200,350],[650,350],[700,350],
    [1100,350],[1500,350],[2000,350],[2500,350],
    [3000,350],[3500,350],[3900,350],
  ];
  for (const [x, y] of coinPositions) {
    coins.push({ x, y: y - 10, collected: false, bob: Math.random() * Math.PI * 2 });
  }

  // Enemies: { x, y, w, h, vx, alive, dir }
  const enemies = [
    { x: 300,  y: 352, vx: 1.2 },
    { x: 550,  y: 352, vx: -1.0 },
    { x: 850,  y: 352, vx: 1.3 },
    { x: 770,  y: 274, vx: 0.8 }, // on platform
    { x: 1050, y: 352, vx: -1.1 },
    { x: 1200, y: 352, vx: 1.0 },
    { x: 1400, y: 352, vx: -1.4 },
    { x: 1590, y: 194, vx: 0.9 }, // on platform
    { x: 1700, y: 352, vx: 1.2 },
    { x: 1950, y: 352, vx: -0.9 },
    { x: 2100, y: 352, vx: 1.3 },
    { x: 2400, y: 352, vx: -1.1 },
    { x: 2600, y: 352, vx: 1.0 },
    { x: 2770, y: 204, vx: 0.8 }, // on platform
    { x: 2850, y: 352, vx: -1.2 },
    { x: 3100, y: 352, vx: 1.4 },
    { x: 3300, y: 352, vx: -1.0 },
    { x: 3500, y: 352, vx: 1.1 },
    { x: 3700, y: 352, vx: -1.3 },
    { x: 3900, y: 352, vx: 1.2 },
  ].map(e => ({ ...e, y: e.y, w: 28, h: 28, alive: true, dir: e.vx > 0 ? 1 : -1, legAnim: 0 }));

  return { platforms, coins, enemies };
}

// ══════════════════════════════════════════════════════════════
//  PLAYER
// ══════════════════════════════════════════════════════════════
function createPlayer() {
  return {
    x: 60, y: 300,         // world position
    w: 28, h: 38,          // hitbox size
    vx: 0, vy: 0,          // velocity
    onGround: false,
    jumpsLeft: 2,          // double jump allowed
    facing: 1,             // 1 = right, -1 = left
    animFrame: 0,          // walk cycle frame (0–3)
    animTimer: 0,
    invincible: 0,         // frames of invincibility after hit
    dead: false,
  };
}

// ══════════════════════════════════════════════════════════════
//  GAME OBJECT (singleton reset on each play)
// ══════════════════════════════════════════════════════════════
let G = {}; // holds player, level data, score, camera, etc.

function initGame() {
  const { platforms, coins, enemies } = buildLevel();
  G = {
    player:    createPlayer(),
    platforms,
    coins,
    enemies,
    score:     0,
    lives:     3,
    coinCount: 0,
    camX:      0,   // camera x offset in world space
    particles: [],  // visual FX
    frame:     0,   // global frame counter (for animations)
    flagX:     4100, // x position of the goal flag
  };
  updateHUD();
}

// ══════════════════════════════════════════════════════════════
//  INPUT HANDLING
// ══════════════════════════════════════════════════════════════
// Jump is triggered on keydown to feel snappy
function handleJump(e) {
  if (state !== 'playing') return;
  if (['Space','ArrowUp','KeyZ','KeyW'].includes(e.code)) {
    e.preventDefault();
    const p = G.player;
    if (p.jumpsLeft > 0 && !p.dead) {
      p.vy = JUMP_VEL;
      p.jumpsLeft--;
      spawnJumpParticles(p);
    }
  }
}

function readInput(player) {
  // Horizontal movement
  const left  = keys['ArrowLeft']  || keys['KeyA'];
  const right = keys['ArrowRight'] || keys['KeyD'];
  player.vx = 0;
  if (left)  { player.vx = -MOVE_SPD; player.facing = -1; }
  if (right) { player.vx =  MOVE_SPD; player.facing =  1; }
}

// ══════════════════════════════════════════════════════════════
//  COLLISION DETECTION HELPERS
// ══════════════════════════════════════════════════════════════

// Axis-Aligned Bounding Box overlap
function aabb(a, b) {
  return a.x < b.x + b.w &&
         a.x + a.w > b.x &&
         a.y < b.y + b.h &&
         a.y + a.h > b.y;
}

// Resolve player vs platform collision (only push out vertically downward or upward)
function resolvePlatform(player, plat) {
  if (!aabb(player, plat)) return;

  const overlapBottom = (player.y + player.h) - plat.y;
  const overlapTop    = (plat.y + plat.h) - player.y;
  const overlapLeft   = (player.x + player.w) - plat.x;
  const overlapRight  = (plat.x + plat.w) - player.x;

  // Find minimum penetration axis
  const minV = Math.min(overlapBottom, overlapTop, overlapLeft, overlapRight);

  if (minV === overlapBottom && player.vy >= 0) {
    // Falling onto platform from above
    player.y = plat.y - player.h;
    player.vy = 0;
    player.onGround = true;
    player.jumpsLeft = 2; // restore jumps on landing
  } else if (minV === overlapTop && player.vy < 0) {
    // Hitting ceiling from below
    player.y = plat.y + plat.h;
    player.vy = 0;
  } else if (minV === overlapLeft) {
    player.x = plat.x - player.w;
    player.vx = 0;
  } else if (minV === overlapRight) {
    player.x = plat.x + plat.w;
    player.vx = 0;
  }
}

// ══════════════════════════════════════════════════════════════
//  PARTICLES
// ══════════════════════════════════════════════════════════════
function spawnParticles(x, y, color, count = 8) {
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    const speed = 2 + Math.random() * 3;
    G.particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      life: 1,
      decay: 0.04 + Math.random() * 0.04,
      size: 4 + Math.random() * 4,
      color,
    });
  }
}

function spawnJumpParticles(player) {
  const cx = player.x + player.w / 2;
  const cy = player.y + player.h;
  spawnParticles(cx, cy, '#8ecae6', 6);
}

function spawnCoinParticles(x, y) {
  spawnParticles(x, y, '#f5a623', 10);
}

function spawnEnemyParticles(x, y) {
  spawnParticles(x, y, '#e94560', 12);
}

function updateParticles() {
  G.particles = G.particles.filter(p => p.life > 0);
  for (const p of G.particles) {
    p.x  += p.vx;
    p.y  += p.vy;
    p.vy += 0.15; // particle gravity
    p.life -= p.decay;
  }
}

// ══════════════════════════════════════════════════════════════
//  UPDATE (game logic, called every frame)
// ══════════════════════════════════════════════════════════════
function update() {
  if (state !== 'playing') return;
  G.frame++;
  const p = G.player;

  // ── Input ──────────────────────────────────────────────────
  readInput(p);

  // ── Physics ────────────────────────────────────────────────
  p.vy += GRAVITY;          // apply gravity
  p.x  += p.vx;
  p.y  += p.vy;
  p.onGround = false;       // reset each frame, set by collision

  // ── Platform collisions ────────────────────────────────────
  for (const plat of G.platforms) {
    resolvePlatform(p, plat);
  }

  // ── World bounds: don't go left of world ──────────────────
  if (p.x < 0) { p.x = 0; p.vx = 0; }

  // ── Fell off the bottom ───────────────────────────────────
  if (p.y > H + 100) {
    loseLife();
    return;
  }

  // ── Coin collection ────────────────────────────────────────
  for (const coin of G.coins) {
    if (coin.collected) continue;
    const coinBox = { x: coin.x - 8, y: coin.y - 8, w: 16, h: 16 };
    if (aabb(p, coinBox)) {
      coin.collected = true;
      G.score += 100;
      G.coinCount++;
      spawnCoinParticles(coin.x, coin.y);
      updateHUD();
    }
  }

  // ── Enemy updates & collisions ─────────────────────────────
  for (const enemy of G.enemies) {
    if (!enemy.alive) continue;

    // Enemy movement + simple reversal at world edges / basic patrol
    enemy.x += enemy.vx * enemy.dir;
    enemy.legAnim += 0.18;

    // Reverse at platform edges or a hard patrol boundary (±120 px from spawn)
    // Simple approach: bounce every 120 world-px
    if (!enemy._startX) enemy._startX = enemy.x;
    if (Math.abs(enemy.x - enemy._startX) > 120) {
      enemy.dir *= -1;
    }

    // Enemy vs player
    if (p.invincible > 0) { p.invincible--; continue; }

    const enemyBox = { x: enemy.x, y: enemy.y, w: enemy.w, h: enemy.h };
    if (aabb(p, enemyBox)) {
      // Stomp: player falling & feet above enemy center → kill enemy
      if (p.vy > 0 && (p.y + p.h) < (enemy.y + enemy.h * 0.55)) {
        enemy.alive = false;
        p.vy = JUMP_VEL * 0.7; // bounce up on stomp
        G.score += 200;
        spawnEnemyParticles(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2);
        updateHUD();
      } else {
        // Touched enemy from side → lose life
        loseLife();
        return;
      }
    }
  }

  // ── Score: distance bonus ──────────────────────────────────
  const distBonus = Math.floor(p.x / 50);
  G.score = Math.max(G.score, distBonus * 10); // score never drops
  scoreDisplay.textContent = G.score;

  // ── Player animation ────────────────────────────────────────
  if (p.vx !== 0 && p.onGround) {
    p.animTimer++;
    if (p.animTimer > 6) { p.animTimer = 0; p.animFrame = (p.animFrame + 1) % 4; }
  } else if (!p.onGround) {
    p.animFrame = 2; // "jump" pose
  } else {
    p.animFrame = 0; // idle
  }

  // ── Camera scrolling ───────────────────────────────────────
  // Keep player roughly 40% from the left of the screen
  const targetCamX = p.x - CAM_SLACK;
  G.camX += (targetCamX - G.camX) * 0.12; // smooth lerp
  G.camX = Math.max(0, G.camX);

  // ── Win condition: reached flag ────────────────────────────
  if (p.x + p.w > G.flagX) {
    triggerWin();
  }

  updateParticles();
}

// ══════════════════════════════════════════════════════════════
//  LIFE / DEATH
// ══════════════════════════════════════════════════════════════
function loseLife() {
  G.lives--;
  updateHUD();
  if (G.lives <= 0) {
    triggerGameOver();
  } else {
    // Respawn at start
    const p = G.player;
    p.x = 60; p.y = 300; p.vx = 0; p.vy = 0;
    p.invincible = 120; // 2 seconds
    G.camX = 0;
  }
}

function triggerGameOver() {
  state = 'dead';
  document.getElementById('finalScore').textContent = 'SCORE: ' + G.score;
  gameOverScreen.style.display = 'flex';
}

function triggerWin() {
  state = 'win';
  G.score += G.coinCount * 50 + G.lives * 500; // bonus
  document.getElementById('winScore').textContent = 'SCORE: ' + G.score;
  winScreen.style.display = 'flex';
}

function updateHUD() {
  scoreDisplay.textContent  = G.score;
  coinDisplay.textContent   = G.coinCount;
  livesDisplay.textContent  = G.lives;
}

// ══════════════════════════════════════════════════════════════
//  DRAWING
// ══════════════════════════════════════════════════════════════

// Helper: translate to screen space
function sx(worldX) { return worldX - G.camX; }

/* ─── Background parallax layers ─── */
function drawBackground() {
  // Sky gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0d1b2a');
  grad.addColorStop(1, '#1a3a5c');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Stars (static – camera doesn't affect them)
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  const starSeed = [
    [50,30],[120,80],[200,20],[320,60],[400,10],[480,90],[560,40],[700,70],
    [80,120],[240,140],[380,100],[620,150],[760,30],[700,130],[150,160],
  ];
  for (const [x, y] of starSeed) {
    const twinkle = 0.5 + 0.5 * Math.sin(G.frame * 0.04 + x);
    ctx.globalAlpha = twinkle * 0.8;
    ctx.fillRect(x, y, 2, 2);
  }
  ctx.globalAlpha = 1;

  // Distant hills (slow parallax)
  const pFar = G.camX * 0.15;
  ctx.fillStyle = '#1c3a52';
  for (let i = 0; i < 6; i++) {
    const hx = (i * 200 - pFar % 200) - 50;
    const hy = 280 - (i % 3) * 40;
    ctx.beginPath();
    ctx.arc(hx, hy, 100, Math.PI, 0);
    ctx.closePath();
    ctx.fill();
  }

  // Mid hills
  const pMid = G.camX * 0.35;
  ctx.fillStyle = '#1f4433';
  for (let i = 0; i < 7; i++) {
    const hx = (i * 160 - pMid % 160) - 30;
    const hy = 340 - (i % 2) * 30;
    ctx.beginPath();
    ctx.arc(hx, hy, 70, Math.PI, 0);
    ctx.closePath();
    ctx.fill();
  }
}

/* ─── Platforms ─── */
function drawPlatforms() {
  for (const plat of G.platforms) {
    const screenX = sx(plat.x);
    if (screenX > W + 10 || screenX + plat.w < -10) continue; // cull off-screen

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(screenX + 4, plat.y + 4, plat.w, plat.h);

    // Main body
    ctx.fillStyle = plat.color;
    ctx.fillRect(screenX, plat.y, plat.w, plat.h);

    // Top highlight
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(screenX, plat.y, plat.w, 4);

    // Grass / top detail for ground
    if (plat.h > 40) {
      ctx.fillStyle = '#40916c';
      ctx.fillRect(screenX, plat.y, plat.w, 12);
      // little grass tufts
      ctx.fillStyle = '#52b788';
      for (let gx = screenX + 10; gx < screenX + plat.w; gx += 20) {
        ctx.fillRect(gx,     plat.y - 3, 3, 6);
        ctx.fillRect(gx + 5, plat.y - 5, 3, 8);
        ctx.fillRect(gx + 10, plat.y - 2, 3, 5);
      }
    }
  }
}

/* ─── Coins ─── */
function drawCoins() {
  for (const coin of G.coins) {
    if (coin.collected) continue;
    const screenX = sx(coin.x);
    if (screenX < -20 || screenX > W + 20) continue;

    // Bob animation
    const bobY = coin.y + Math.sin(G.frame * 0.07 + coin.bob) * 3;

    // Glow
    ctx.save();
    ctx.shadowColor = '#f5a623';
    ctx.shadowBlur  = 10;
    // Coin body
    ctx.fillStyle = '#f5a623';
    ctx.beginPath();
    ctx.arc(screenX, bobY, 7, 0, Math.PI * 2);
    ctx.fill();
    // Inner shine
    ctx.fillStyle = '#ffe066';
    ctx.beginPath();
    ctx.arc(screenX - 2, bobY - 2, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // '$' symbol
    ctx.fillStyle = '#a0522d';
    ctx.font = 'bold 7px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('★', screenX, bobY + 2.5);
  }
}

/* ─── Enemies ─── */
function drawEnemies() {
  for (const enemy of G.enemies) {
    if (!enemy.alive) continue;
    const screenX = sx(enemy.x);
    if (screenX < -50 || screenX > W + 50) continue;

    const ex = screenX;
    const ey = enemy.y;
    const ew = enemy.w;
    const eh = enemy.h;
    const cx = ex + ew / 2;

    // Body (rounded red square)
    ctx.fillStyle = '#c1121f';
    ctx.beginPath();
    ctx.roundRect(ex, ey, ew, eh - 4, 5);
    ctx.fill();

    // Eyes
    const eyeDir = enemy.dir;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(cx + eyeDir * 5, ey + 8, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath();
    ctx.arc(cx + eyeDir * 6, ey + 8, 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Angry brow
    ctx.strokeStyle = '#1a1a2e';
    ctx.lineWidth = 2;
    ctx.beginPath();
    if (eyeDir === 1) {
      ctx.moveTo(cx + 1, ey + 4); ctx.lineTo(cx + 10, ey + 2);
    } else {
      ctx.moveTo(cx - 1, ey + 4); ctx.lineTo(cx - 10, ey + 2);
    }
    ctx.stroke();

    // Walking legs (2 stumps)
    const leg = Math.sin(enemy.legAnim) * 4;
    ctx.fillStyle = '#780000';
    ctx.fillRect(ex + 4,      ey + eh - 8, 8, 8 + leg);
    ctx.fillRect(ex + ew - 12, ey + eh - 8, 8, 8 - leg);

    // Spikes on top (danger indicator)
    ctx.fillStyle = '#e63946';
    for (let s = 0; s < 3; s++) {
      const sx_ = ex + 4 + s * 9;
      ctx.beginPath();
      ctx.moveTo(sx_, ey);
      ctx.lineTo(sx_ + 4, ey - 7);
      ctx.lineTo(sx_ + 8, ey);
      ctx.closePath();
      ctx.fill();
    }
  }
}

/* ─── Player ─── */
function drawPlayer() {
  const p = G.player;
  const screenX = sx(p.x);
  const py = p.y;

  // Invincibility blink
  if (p.invincible > 0 && Math.floor(p.invincible / 6) % 2 === 0) return;

  const cx   = screenX + p.w / 2;
  const dir  = p.facing;
  const walk = p.animFrame;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(cx, py + p.h + 2, 12, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Legs (animated walk)
  const legSwing = p.onGround ? Math.sin(walk * Math.PI / 2) * 5 : 0;
  ctx.fillStyle = '#2196f3';
  ctx.fillRect(screenX + 4,        py + p.h - 14, 9, 14 + legSwing);
  ctx.fillRect(screenX + p.w - 13, py + p.h - 14, 9, 14 - legSwing);

  // Body
  ctx.fillStyle = '#e94560';
  ctx.beginPath();
  ctx.roundRect(screenX + 2, py + 12, p.w - 4, p.h - 18, 5);
  ctx.fill();

  // Head
  ctx.fillStyle = '#ffd6a5';
  ctx.beginPath();
  ctx.arc(cx, py + 10, 13, 0, Math.PI * 2);
  ctx.fill();

  // Hat
  ctx.fillStyle = '#e94560';
  ctx.beginPath();
  ctx.roundRect(screenX - 2, py - 2, p.w + 4, 10, [4, 4, 0, 0]);
  ctx.fill();
  ctx.fillRect(screenX - 6, py + 6, p.w + 12, 5); // brim

  // Eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(cx + dir * 4, py + 10, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.arc(cx + dir * 5, py + 10, 2, 0, Math.PI * 2);
  ctx.fill();

  // Mustache
  ctx.fillStyle = '#8b5e3c';
  ctx.beginPath();
  ctx.arc(cx + dir * 2, py + 15, 5, Math.PI, 0);
  ctx.fill();

  // Arms
  const armSwing = p.onGround ? Math.cos(walk * Math.PI / 2) * 5 : 0;
  ctx.fillStyle = '#e94560';
  ctx.fillRect(screenX - 5,    py + 14, 8, 12 + armSwing);
  ctx.fillRect(screenX + p.w - 3, py + 14, 8, 12 - armSwing);
}

/* ─── Goal flag ─── */
function drawFlag() {
  const fx = sx(G.flagX);
  if (fx < -20 || fx > W + 20) return;

  // Pole
  ctx.fillStyle = '#aaa';
  ctx.fillRect(fx, 160, 5, 220);

  // Waving flag
  ctx.fillStyle = '#f5a623';
  const wave = Math.sin(G.frame * 0.1) * 8;
  ctx.beginPath();
  ctx.moveTo(fx + 5, 165);
  ctx.lineTo(fx + 55, 175 + wave);
  ctx.lineTo(fx + 55, 205 + wave);
  ctx.lineTo(fx + 5, 210);
  ctx.closePath();
  ctx.fill();

  // Star on flag
  ctx.fillStyle = '#fff';
  ctx.font = '18px serif';
  ctx.textAlign = 'center';
  ctx.fillText('★', fx + 30, 200 + wave * 0.5);
}

/* ─── Particles ─── */
function drawParticles() {
  for (const p of G.particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(sx(p.x), p.y, Math.max(0, p.size * p.life), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ─── HUD overlays drawn on canvas ─── */
function drawHUDCanvas() {
  // Invincibility warning flash
  if (G.player.invincible > 0) {
    ctx.fillStyle = `rgba(233,69,96,${0.15 * Math.sin(G.frame * 0.5 + 1)})`;
    ctx.fillRect(0, 0, W, H);
  }
}

// ══════════════════════════════════════════════════════════════
//  MAIN RENDER
// ══════════════════════════════════════════════════════════════
function render() {
  ctx.clearRect(0, 0, W, H);
  if (state === 'start') {
    // Draw a preview still
    drawBackground();
    return;
  }
  drawBackground();
  drawFlag();
  drawPlatforms();
  drawCoins();
  drawEnemies();
  drawPlayer();
  drawParticles();
  drawHUDCanvas();
}

// ══════════════════════════════════════════════════════════════
//  GAME LOOP
// ══════════════════════════════════════════════════════════════
function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

// ══════════════════════════════════════════════════════════════
//  BUTTON WIRING
// ══════════════════════════════════════════════════════════════
document.getElementById('startBtn').addEventListener('click', () => {
  startScreen.style.display = 'none';
  initGame();
  state = 'playing';
});

document.getElementById('restartBtn').addEventListener('click', () => {
  gameOverScreen.style.display = 'none';
  initGame();
  state = 'playing';
});

document.getElementById('winRestartBtn').addEventListener('click', () => {
  winScreen.style.display = 'none';
  initGame();
  state = 'playing';
});

// ══════════════════════════════════════════════════════════════
//  BOOTSTRAP
// ══════════════════════════════════════════════════════════════
state = 'start';
initGame();           // pre-init so preview renders
state = 'start';      // keep in start state until button pressed
loop();               // start the render/update loop
</script>
</body>
</html>
